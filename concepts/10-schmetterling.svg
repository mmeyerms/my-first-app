<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg10" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FAF6F2" />
      <stop offset="100%" stop-color="#F0E6D8" />
    </radialGradient>
    <linearGradient id="wing10a" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F4D9A8" />
      <stop offset="50%" stop-color="#E78BAA" />
      <stop offset="100%" stop-color="#A8636E" />
    </linearGradient>
    <linearGradient id="wing10b" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#A8636E" />
      <stop offset="50%" stop-color="#E78BAA" />
      <stop offset="100%" stop-color="#F4D9A8" />
    </linearGradient>
    <radialGradient id="bodyGlow10" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="115" fill="url(#bg10)" />

  <!-- Body glow -->
  <ellipse cx="120" cy="120" rx="35" ry="60" fill="url(#bodyGlow10)" />

  <!-- LEFT WING -->
  <!-- Upper left wing -->
  <path d="M 120 90
           C 90 60, 50 60, 35 90
           C 25 110, 35 125, 60 130
           C 85 132, 110 120, 120 105 Z"
        fill="url(#wing10a)" stroke="#5E3D44" stroke-width="1.4" stroke-linejoin="round" />
  <!-- Lower left wing -->
  <path d="M 120 130
           C 100 145, 55 175, 45 165
           C 35 150, 45 130, 70 125
           C 90 122, 110 130, 120 130 Z"
        fill="url(#wing10b)" stroke="#5E3D44" stroke-width="1.4" stroke-linejoin="round" />

  <!-- RIGHT WING (mirror) -->
  <!-- Upper right wing -->
  <path d="M 120 90
           C 150 60, 190 60, 205 90
           C 215 110, 205 125, 180 130
           C 155 132, 130 120, 120 105 Z"
        fill="url(#wing10a)" stroke="#5E3D44" stroke-width="1.4" stroke-linejoin="round" />
  <!-- Lower right wing -->
  <path d="M 120 130
           C 140 145, 185 175, 195 165
           C 205 150, 195 130, 170 125
           C 150 122, 130 130, 120 130 Z"
        fill="url(#wing10b)" stroke="#5E3D44" stroke-width="1.4" stroke-linejoin="round" />

  <!-- Wing pattern accents (eye spots) -->
  <g>
    <circle cx="65" cy="100" r="6" fill="#5E3D44" opacity="0.7" />
    <circle cx="65" cy="100" r="2.5" fill="#D4A574" />
    <circle cx="175" cy="100" r="6" fill="#5E3D44" opacity="0.7" />
    <circle cx="175" cy="100" r="2.5" fill="#D4A574" />
    <circle cx="75" cy="155" r="4" fill="#5E3D44" opacity="0.6" />
    <circle cx="165" cy="155" r="4" fill="#5E3D44" opacity="0.6" />
  </g>

  <!-- Wing decorative dashes -->
  <g stroke="#5E3D44" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M 50 95 Q 75 85, 100 95" />
    <path d="M 140 95 Q 165 85, 190 95" />
    <path d="M 60 145 Q 80 140, 100 148" />
    <path d="M 140 148 Q 160 140, 180 145" />
  </g>

  <!-- Body (center) -->
  <ellipse cx="120" cy="120" rx="6" ry="38" fill="#5E3D44" />
  <ellipse cx="120" cy="120" rx="3" ry="35" fill="#A8636E" opacity="0.7" />

  <!-- Head -->
  <circle cx="120" cy="80" r="6" fill="#5E3D44" />

  <!-- Antennae -->
  <g stroke="#5E3D44" stroke-width="1.2" stroke-linecap="round" fill="none">
    <path d="M 117 76 Q 108 60, 105 50" />
    <path d="M 123 76 Q 132 60, 135 50" />
  </g>
  <circle cx="105" cy="50" r="1.8" fill="#D4A574" />
  <circle cx="135" cy="50" r="1.8" fill="#D4A574" />

  <!-- Floating accent dots -->
  <g fill="#D4A574">
    <circle cx="30" cy="40" r="1.3" opacity="0.7" />
    <circle cx="210" cy="40" r="1.3" opacity="0.7" />
    <circle cx="30" cy="200" r="1.3" opacity="0.7" />
    <circle cx="210" cy="200" r="1.3" opacity="0.7" />
    <circle cx="120" cy="220" r="1" opacity="0.55" />
    <circle cx="20" cy="120" r="0.9" opacity="0.5" />
    <circle cx="220" cy="120" r="0.9" opacity="0.5" />
  </g>
</svg>
