      <g transform="rotate(180)"><path d="M0 -90 C 4 -82, 4 -72, 0 -68 C -4 -72, -4 -82, 0 -90 Z" /></g>
      <g transform="rotate(202.5)"><path d="M0 -90 C 4 -82, 4 -72, 0 -68 C -4 -72, -4 -82, 0 -90 Z" /></g>
      <g transform="rotate(225)"><path d="M0 -90 C 4 -82, 4 -72, 0 -68 C -4 -72, -4 -82, 0 -90 Z" /></g>
      <g transform="rotate(247.5)"><path d="M0 -90 C 4 -82, 4 -72, 0 -68 C -4 -72, -4 -82, 0 -90 Z" /></g>
