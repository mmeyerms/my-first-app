  <!-- Center -->
  <circle cx="120" cy="120" r="14" fill="url(#center8)" stroke="#5E3D44" stroke-width="1" />
  <circle cx="120" cy="120" r="6" fill="#D4A574" />
  <circle cx="116" cy="116" r="2" fill="#FFFFFF" opacity="0.7" />
