      <g transform="rotate(240)"><path d="M0 -38 C 7 -32, 7 -22, 0 -18 C -7 -22, -7 -32, 0 -38 Z" /></g>
      <g transform="rotate(300)"><path d="M0 -38 C 7 -32, 7 -22, 0 -18 C -7 -22, -7 -32, 0 -38 Z" /></g>
