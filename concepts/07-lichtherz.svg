<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg7" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FAF6F2" />
      <stop offset="100%" stop-color="#EFE4D2" />
    </radialGradient>
    <radialGradient id="heart7" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F4A6C8" />
      <stop offset="60%" stop-color="#A8636E" />
      <stop offset="100%" stop-color="#5E3D44" />
    </radialGradient>
    <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4A6C8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F4A6C8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="115" fill="url(#bg7)" />

  <!-- Heartbeat ECG line - flowing across with full amplitude -->
  <g stroke="#A8636E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 20 130
             L 50 130
             L 60 130
             L 70 100
             L 78 160
             L 86 80
             L 94 150
             L 102 130
             L 116 130
             L 132 130
             L 148 130
             L 220 130" />
  </g>

  <!-- Echo / fading second wave -->
  <g stroke="#D4A574" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <path d="M 20 145
             L 50 145
             L 60 145
             L 70 122
             L 78 168
             L 86 110
             L 94 162
             L 102 145
             L 116 145
             L 132 145
             L 148 145
             L 220 145" />
  </g>

  <!-- Heart glow -->
  <circle cx="120" cy="120" r="60" fill="url(#heartGlow)" />

  <!-- Heart shape (the destination of the heartbeat) -->
  <path d="M 120 168
           C 100 155, 75 130, 75 105
           C 75 90, 87 80, 100 80
           C 112 80, 120 90, 120 100
           C 120 90, 128 80, 140 80
           C 153 80, 165 90, 165 105
           C 165 130, 140 155, 120 168 Z"
        fill="url(#heart7)" stroke="#5E3D44" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Inner highlight on heart -->
  <ellipse cx="105" cy="100" rx="14" ry="10" fill="#FFFFFF" opacity="0.35" />

  <!-- Tiny accent stars -->
  <g fill="#D4A574">
    <circle cx="40" cy="60" r="1.5" opacity="0.8" />
    <circle cx="200" cy="50" r="1.2" opacity="0.7" />
    <circle cx="55" cy="200" r="1.3" opacity="0.75" />
    <circle cx="195" cy="190" r="1.6" opacity="0.85" />
    <circle cx="220" cy="100" r="0.9" opacity="0.55" />
    <circle cx="25" cy="100" r="0.9" opacity="0.55" />
  </g>
</svg>
