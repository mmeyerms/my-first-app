<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg9" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FAF6F2" />
      <stop offset="100%" stop-color="#EFE4D2" />
    </radialGradient>
    <linearGradient id="brush9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E3D44" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#5E3D44" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#5E3D44" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#5E3D44" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="115" fill="url(#bg9)" />

  <!-- Faint inner circle hint -->
  <circle cx="120" cy="120" r="65" stroke="#D4A574" stroke-width="0.4" fill="none" stroke-dasharray="1 4" opacity="0.4" />

  <!-- Main Enso brush stroke (with intentional gap) -->
  <!-- Drawn as a thick variable stroke from 1 o'clock around to ~11 o'clock with gap at 12 -->
  <path d="M 165 70
           C 195 90, 200 130, 180 165
           C 160 195, 115 200, 80 180
           C 45 158, 40 115, 60 85
           C 80 60, 115 50, 145 60"
        stroke="url(#brush9)" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Brush texture overlay (slightly off, gives ink wash feel) -->
  <path d="M 165 70
           C 195 90, 200 130, 180 165
           C 160 195, 115 200, 80 180
           C 45 158, 40 115, 60 85
           C 80 60, 115 50, 145 60"
        stroke="#5E3D44" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" />

  <!-- Inner highlight (gives the brush dimension) -->
  <path d="M 165 70
           C 195 90, 200 130, 180 165
           C 160 195, 115 200, 80 180
           C 45 158, 40 115, 60 85
           C 80 60, 115 50, 145 60"
        stroke="#A8636E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" />

  <!-- Small accent dot near gap (the "imperfection" of Enso) -->
  <circle cx="155" cy="64" r="2.5" fill="#D4A574" opacity="0.85" />
  <circle cx="155" cy="64" r="6" fill="#D4A574" opacity="0.2" />

  <!-- Tiny accent stars in the negative space -->
  <g fill="#5E3D44" opacity="0.4">
    <circle cx="120" cy="120" r="1.5" />
  </g>
  <g fill="#D4A574">
    <circle cx="40" cy="50" r="1.2" opacity="0.7" />
    <circle cx="200" cy="200" r="1.4" opacity="0.75" />
    <circle cx="200" cy="50" r="1" opacity="0.6" />
    <circle cx="40" cy="200" r="1.1" opacity="0.65" />
  </g>
</svg>
