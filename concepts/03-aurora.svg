    <path d="M50 130 Q 90 95, 130 125 Q 170 155, 210 110" stroke="url(#aur2)" stroke-width="20" fill="none" stroke-linecap="round" />
    <path d="M30 180 Q 80 145, 130 175 Q 180 200, 215 165" stroke="url(#aur3)" stroke-width="18" fill="none" stroke-linecap="round" />
