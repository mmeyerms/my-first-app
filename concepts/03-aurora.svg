<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0A1628" />
      <stop offset="100%" stop-color="#03081A" />
    </radialGradient>
    <linearGradient id="aur1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8E6CF" stop-opacity="0" />
      <stop offset="50%" stop-color="#A8E6CF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="aur2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8B4F6" stop-opacity="0" />
      <stop offset="50%" stop-color="#C8B4F6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F4A6C8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="aur3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4D9A8" stop-opacity="0" />
      <stop offset="50%" stop-color="#F4D9A8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFB6C1" stop-opacity="0" />
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="115" fill="url(#bg3)" />
  <!-- Stars -->
  <g fill="#FFF6E5">
